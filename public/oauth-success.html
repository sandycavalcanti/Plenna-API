<!DOCTYPE html>
<html>
  <head>
    <title>Conectando...</title>
    <script>
      // tenta abrir o app
      const tentativa = new URLSearchParams(window.location.search).get('tentativa');
      const suffix = /^[a-f0-9-]{36}$/i.test(tentativa ?? '')
        ? '?tentativa=' + encodeURIComponent(tentativa)
        : '';
      window.location.href = 'plenna://oauth-success' + suffix;

      // fallback caso não abra
      setTimeout(() => {
        document.body.innerHTML =
          "<h2>Conta conectada com sucesso 🎉</h2><p>Você pode voltar para o app.</p>";
      }, 1500);
    </script>
  </head>
  <body>
    <p>Conectando ao aplicativo...</p>
  </body>
</html>
